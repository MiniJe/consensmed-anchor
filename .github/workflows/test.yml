name: test

on:
  push:

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      # Dependencies are installed, never tracked: contracts/lib/ is ignored on purpose.
      - name: Install dependencies
        run: forge install --no-git foundry-rs/forge-std@v1.17.0 OpenZeppelin/openzeppelin-contracts@v5.7.0

      - name: Run tests
        run: forge test -vvv

      # The registry must stay unable to hold text: only fixed-size values may appear in the contract.
      - name: No dynamic text fields in the contract
        run: "! grep -nP '\\b(string|bytes)\\b(?!\\d)' src/ConsensMedVerify.sol"
